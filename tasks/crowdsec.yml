- name: Install CrowdSec Repository
  shell:
    cmd: "curl -s https://install.crowdsec.net | sh"
    creates: "/etc/apt/sources.list.d/crowdsec.list"

- name: Install CrowdSec package
  apt:
    name: crowdsec
    state: present
    update_cache: yes

- name: Install CrowdSec firewall bouncer for iptables
  apt:
    name: crowdsec-firewall-bouncer-iptables
    state: present

- name: Protect Docker containers with CrowdSec firewall bouncer
  copy:
    dest: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml.local
    content: |
      iptables_chains:
        - INPUT
        - DOCKER-USER
  notify: Restart CrowdSec firewall bouncer
