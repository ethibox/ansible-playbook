- hosts: "{{ target | default('all') }}"
  become: yes

  vars:
    ssh_server_ports: ['22']
    allowed_ports: ['80', '443']
    sysctl_overwrite:
      net.ipv4.ip_forward: 1

  pre_tasks:
    - include_tasks: tasks/apt.yml
    - include_tasks: tasks/restic.yml
    - include_tasks: tasks/rclone.yml
    - include_tasks: tasks/docker.yml
    - include_tasks: tasks/golang.yml
    - include_tasks: tasks/iptables.yml
    - include_tasks: tasks/crowdsec.yml
    - include_tasks: tasks/sysctl.yml
    - include_tasks: tasks/timezone.yml

  handlers:
    - name: Restart CrowdSec firewall bouncer
      systemd:
        name: crowdsec-firewall-bouncer
        state: restarted

  roles:
    - devsec.hardening.os_hardening
    - devsec.hardening.ssh_hardening
